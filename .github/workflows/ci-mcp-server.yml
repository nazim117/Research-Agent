name: CI - MCP Server

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/mcp-server/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'services/mcp-server/**'

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-mcp-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/mcp-server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pip-audit

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

      - name: pip-audit
        # Catches known CVEs in the resolved dependency tree.
        run: pip-audit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (smoke test)
        run: docker build -t mcp-server:ci services/mcp-server
