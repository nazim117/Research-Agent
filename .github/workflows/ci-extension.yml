name: CI - Extension

on:
  push:
    branches: [ "main" ]
    paths:
      - 'clients/extension/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'clients/extension/**'

concurrency:
  group: ci-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Validate JS syntax
        run: |
          node --check clients/extension/background.js
          node --check clients/extension/content.js
          node --check clients/extension/sidepanel.js

      - name: Package extension
        run: zip -r extension.zip clients/extension/ -x "clients/extension/*.md"

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension.zip
          retention-days: 30
