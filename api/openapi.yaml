openapi: "3.0.3"
info:
  title: research-agent
  version: "1.0.0"
  description: Local-first project-brain assistant API.

servers:
  - url: http://localhost:8000

tags:
  - name: projects
    description: Project CRUD
  - name: chat
    description: Conversational interface to the project brain
  - name: ingest
    description: Document and URL ingestion pipeline
  - name: studio
    description: Extracted decisions, risks, action items, briefings, and standups
  - name: workflow
    description: Stored named procedures replayed as read-only guidance in chat
  - name: entities
    description: Tracked people/stakeholders/tickets/organizations (entity memory)
  - name: toolbox
    description: Per-tool success/failure track record, derived from the tool-call log
  - name: cache
    description: Embedding cache visibility
  - name: scratchpad
    description: Read-only inspection of the deep-research working memory
  - name: memory
    description: Semantic search over conversation memory

paths:
  /health:
    get:
      summary: Liveness check
      operationId: health
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /projects:
    get:
      tags: [projects]
      summary: List all projects
      operationId: listProjects
      responses:
        "200":
          description: Array of projects, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      tags: [projects]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          description: A project with that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}:
    patch:
      tags: [projects]
      summary: Partial update of a project
      operationId: patchProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [projects]
      summary: Delete a project and all its state
      operationId: deleteProject
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /chat:
    post:
      tags: [chat]
      summary: Send a message to the project brain
      description: >
        `project_id` is passed in the request body (not the path) because chat
        is a stateless endpoint — the caller owns the session and can switch
        projects between turns without changing the URL.
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Assistant reply with optional citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: LLM or embedding service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ingest:
    post:
      tags: [ingest]
      summary: Ingest a document (chunk + embed)
      description: >
        `project_id` is passed in the request body so ingest can be called
        without a project-scoped path, matching the same convention as /chat.
      operationId: ingest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Number of chunks stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Embedding service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ingest/transcript:
    post:
      tags: [ingest]
      summary: Ingest a pasted transcript (chunk + extract decisions/action items/risks)
      operationId: ingestTranscript
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestTranscriptRequest"
      responses:
        "200":
          description: Ingest counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestTranscriptResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: LLM or embedding service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ingest/file:
    post:
      tags: [ingest]
      summary: Upload and ingest a file
      operationId: ingestFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project_id, file]
              properties:
                project_id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum: [document, transcript]
                  default: document
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Ingest counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestTranscriptResponse"
        "400":
          description: Unsupported file type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: LLM or embedding service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /ingest/url:
    post:
      tags: [ingest]
      summary: Fetch and ingest content at a URL
      operationId: ingestUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, url]
              properties:
                project_id:
                  type: string
                  format: uuid
                url:
                  type: string
                  format: uri
                kind:
                  type: string
                  enum: [document, transcript]
                  default: document
      responses:
        "200":
          description: Ingest counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestTranscriptResponse"
        "400":
          description: URL not reachable or content not extractable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: LLM or embedding service unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/decisions:
    get:
      tags: [studio]
      summary: List decisions extracted from transcripts
      operationId: listDecisions
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Decision"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/action-items:
    get:
      tags: [studio]
      summary: List transcript action items
      operationId: listActionItems
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, done]
      responses:
        "200":
          description: List of action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionItem"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/risks:
    get:
      tags: [studio]
      summary: List risks extracted from transcripts
      operationId: listRisks
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of risks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Risk"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/briefing:
    get:
      tags: [studio]
      summary: Project status snapshot with AI summary
      operationId: getBriefing
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Briefing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Briefing"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: LLM unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/standup:
    get:
      tags: [studio]
      summary: Daily standup (Yesterday / Today / Blockers)
      operationId: getStandup
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Standup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Standup"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: LLM unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/sources:
    get:
      tags: [studio]
      summary: List ingested document sources with chunk counts
      operationId: listSources
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/workflows:
    post:
      tags: [workflow]
      summary: Create or replace a stored workflow by name
      description: >
        Explicit, hand-authored procedure storage — steps aren't derived from
        live tool-call history. Re-saving the same name replaces its steps
        rather than duplicating them. Matched workflows are folded into /chat
        as read-only guidance; nothing executes automatically.
      operationId: saveWorkflow
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowCreateRequest"
      responses:
        "200":
          description: Created or replaced workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [workflow]
      summary: List all stored workflows for a project, newest first
      operationId: listWorkflows
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/workflows/{name}:
    delete:
      tags: [workflow]
      summary: Delete a stored workflow by name
      operationId: deleteWorkflow
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: deleted
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/entities:
    get:
      tags: [entities]
      summary: List tracked entities for a project, most recently updated first
      description: >
        Read-only inspection of entity memory (people, stakeholders, tickets,
        organizations) — populated by extraction at ingest time, not created
        directly through this API. Matching entities are folded into /chat as
        passive background context.
      operationId: listEntities
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entity"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/toolbox/stats:
    get:
      tags: [toolbox]
      summary: Per-tool success/failure track record for a project
      description: >
        Derived from the tool_calls log. Also consumed internally by /chat to
        annotate matched workflow steps with their real track record.
      operationId: getToolboxStats
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Per-tool stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolStats"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/cache/stats:
    get:
      tags: [cache]
      summary: Embedding-cache entry count and cumulative hit count
      description: >
        Read-only visibility into whether the semantic embedding cache is
        actually absorbing repeated embed() calls for this project.
      operationId: getCacheStats
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Cache stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStats"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /projects/{project_id}/scratchpad:
    get:
      tags: [scratchpad]
      summary: Read-only inspection of the deep-research scratchpad for a session
      description: >
        Debuggability only — no create/update route, since only the
        deep_research tool-calling loop itself writes entries (see
        ChatRequest.deep_research). Entries are cleared at the start of each
        research task.
      operationId: getScratchpad
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: session_id
          in: query
          required: true
          description: Which conversation's scratchpad to read.
          schema:
            type: string
      responses:
        "200":
          description: Scratchpad entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScratchpadEntry"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memory/search:
    get:
      tags: [memory]
      summary: Semantic search over conversation memory
      description: >
        `project_id` is a query parameter (not a path segment) because memory
        search is a cross-cutting utility, not a sub-resource of a single project.
      operationId: memorySearch
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: k
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Memory hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryHit"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error identifier.
          example: not_found
        message:
          type: string
          description: Human-readable explanation.
          example: Project not found

    Project:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Stable UUID assigned at creation.
        name:
          type: string
          description: Human-readable project name.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp (e.g. "2026-04-18T11:08:07Z").

    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true

    ChatRequest:
      type: object
      required: [project_id, session_id, message]
      properties:
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
        message:
          type: string
        web_search:
          type: boolean
          default: false
          description: >
            User-triggered live web search folded into this turn's prompt as
            another citation-numbered context block. The model never decides
            this itself.
        deep_research:
          type: boolean
          default: false
          description: >
            Opts this turn into the multi-step tool-calling research loop
            (read-only tools only). Every step is logged to the project's
            scratchpad for this session — see /projects/{project_id}/scratchpad.

    ChatResponse:
      type: object
      required: [reply]
      properties:
        reply:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"

    Citation:
      type: object
      required: [ref, source, chunk_index]
      properties:
        ref:
          type: integer
        source:
          type: string
        chunk_index:
          type: integer

    IngestRequest:
      type: object
      required: [project_id, source, text]
      properties:
        project_id:
          type: string
          format: uuid
        source:
          type: string
        text:
          type: string

    IngestResponse:
      type: object
      required: [chunks]
      properties:
        chunks:
          type: integer

    IngestTranscriptRequest:
      type: object
      required: [project_id, source, text]
      properties:
        project_id:
          type: string
          format: uuid
        source:
          type: string
        text:
          type: string

    IngestTranscriptResponse:
      type: object
      required: [chunks, decisions, action_items, risks]
      properties:
        chunks:
          type: integer
        decisions:
          type: integer
        action_items:
          type: integer
        risks:
          type: integer

    Decision:
      type: object
      required: [id, source, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time

    ActionItem:
      type: object
      required: [id, source, text, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        owner:
          type: string
          nullable: true
        text:
          type: string
        due_date:
          type: string
          nullable: true
        status:
          type: string
          enum: [open, done]
        created_at:
          type: string
          format: date-time

    Risk:
      type: object
      required: [id, source, text, created_at]
      properties:
        id:
          type: string
          format: uuid
        source:
          type: string
        text:
          type: string
        created_at:
          type: string
          format: date-time

    Briefing:
      type: object
      required: [summary, open_actions, recent_decisions, active_risks, generated_at]
      properties:
        summary:
          type: string
        open_actions:
          type: array
          items:
            type: object
        recent_decisions:
          type: array
          items:
            type: object
        active_risks:
          type: array
          items:
            type: object
        generated_at:
          type: string
          format: date-time

    Standup:
      type: object
      required: [summary, done, today, blockers, generated_at]
      properties:
        summary:
          type: string
        done:
          type: array
          items:
            type: string
        today:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time

    Source:
      type: object
      required: [source, chunks]
      properties:
        source:
          type: string
        chunks:
          type: integer

    WorkflowStepIn:
      type: object
      required: [tool_name]
      properties:
        tool_name:
          type: string
          minLength: 1
        arguments:
          type: object
          default: {}
        description:
          type: string
          nullable: true

    WorkflowCreateRequest:
      type: object
      required: [name, trigger, steps]
      properties:
        name:
          type: string
          minLength: 1
        trigger:
          type: string
          minLength: 1
          description: Comma-separated keywords/phrases matched against incoming chat messages.
        description:
          type: string
          nullable: true
        steps:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/WorkflowStepIn"

    WorkflowStep:
      type: object
      required: [step_order, tool_name, arguments, description]
      properties:
        step_order:
          type: integer
        tool_name:
          type: string
        arguments:
          type: object
        description:
          type: string
          nullable: true

    Workflow:
      type: object
      required: [name, trigger, description, created_at, steps]
      properties:
        name:
          type: string
        trigger:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"

    Entity:
      type: object
      required: [id, name, type, attributes, sources, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          description: Free-text label, e.g. person, stakeholder, organization, ticket.
        attributes:
          type: string
          nullable: true
          description: Free-text notes (role/status/context) as last extracted.
        sources:
          type: array
          items:
            type: string
          description: Source labels this entity has been seen in, deduplicated.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ToolStats:
      type: object
      required: [tool_name, call_count, success_count, failure_count, success_rate, avg_duration_ms, last_used_at]
      properties:
        tool_name:
          type: string
        call_count:
          type: integer
        success_count:
          type: integer
        failure_count:
          type: integer
